name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DiskRescue.sln
      - name: Build
        run: dotnet build DiskRescue.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DiskRescue.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Generate safe disk-image fixtures
        shell: pwsh
        run: |
          ./tools/New-DiskRescueTestImages.ps1 -OutputDirectory "$env:RUNNER_TEMP/DiskRescue-TestImages"
          ./tools/New-NtfsMftPreviewImage.ps1 -OutputPath "$env:RUNNER_TEMP/DiskRescue-TestImages/ntfs-mft-preview.img"
          ./tools/New-LostNtfsPartitionImage.ps1 -OutputPath "$env:RUNNER_TEMP/DiskRescue-TestImages/lost-ntfs-partition.img"
      - name: Smoke-test CLI against generated fixtures
        shell: pwsh
        run: |
          $mbr = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- inspect "$env:RUNNER_TEMP/DiskRescue-TestImages/mbr-valid.img" | ConvertFrom-Json
          if ($mbr.mbr.partitions.Count -ne 1) { throw "MBR fixture did not produce exactly one partition." }
          $gpt = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- inspect "$env:RUNNER_TEMP/DiskRescue-TestImages/gpt-valid.img" | ConvertFrom-Json
          if (-not $gpt.gpt.primaryHeaderValid -or -not $gpt.gpt.backupHeaderValid -or $gpt.gpt.selectedPartitions.Count -ne 1) { throw "Valid GPT fixture did not validate as expected." }
          $backup = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- inspect "$env:RUNNER_TEMP/DiskRescue-TestImages/gpt-primary-header-damaged.img" | ConvertFrom-Json
          if ($backup.gpt.primaryHeaderValid -or -not $backup.gpt.backupHeaderValid -or $backup.gpt.selectedPartitionSource -ne "backup" -or $backup.gpt.selectedPartitions.Count -ne 1) { throw "Damaged-primary fixture did not fall back to the validated backup copy." }
          $ntfsDisk = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- inspect "$env:RUNNER_TEMP/DiskRescue-TestImages/ntfs-mft-preview.img" | ConvertFrom-Json
          if ($ntfsDisk.mbr.partitions.Count -ne 1 -or $ntfsDisk.mbr.partitions[0].byteOffset -ne 512 -or $ntfsDisk.mbr.partitions[0].byteLength -ne 65024) { throw "Synthetic NTFS image did not expose the expected MBR partition boundary." }
          $lostDisk = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- inspect "$env:RUNNER_TEMP/DiskRescue-TestImages/lost-ntfs-partition.img" | ConvertFrom-Json
          if ($lostDisk.mbr.partitions.Count -ne 0 -or -not $lostDisk.mbr.signatureValid) { throw "Lost-partition fixture should have a valid empty MBR partition table." }
          $discovery = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- discover-ntfs "$env:RUNNER_TEMP/DiskRescue-TestImages/lost-ntfs-partition.img" | ConvertFrom-Json
          $lostCandidate = @($discovery.partitionDiscovery.candidates | Where-Object { $_.status -eq "Lost partition candidate" })
          if ($lostCandidate.Count -ne 1 -or $lostCandidate[0].byteOffset -ne 1048576 -or -not $lostCandidate[0].backupBootSectorValid -or $lostCandidate[0].confidence -ne 95) { throw "Lost NTFS partition discovery did not validate the expected candidate." }
          if (-not $discovery.safety.sourceOpenedReadOnly -or $discovery.safety.sourceWriteOperationsAvailable -or $discovery.safety.partitionTableChangesAvailable) { throw "Lost-partition discovery safety assertions failed." }
          $lostPreview = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- scan-ntfs "$env:RUNNER_TEMP/DiskRescue-TestImages/lost-ntfs-partition.img" --offset 1048576 --length 65536 --max-records 4 | ConvertFrom-Json
          if ($lostPreview.scan.entries.Count -ne 1 -or $lostPreview.scan.entries[0].name -ne "Report.txt") { throw "Lost NTFS candidate did not produce the expected bounded file preview." }
          $lostRecovered = "$env:RUNNER_TEMP/DiskRescue-TestImages/Report-recovered-from-lost-partition.txt"
          $lostExtractOutput = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- extract-ntfs-file "$env:RUNNER_TEMP/DiskRescue-TestImages/lost-ntfs-partition.img" --offset 1048576 --length 65024 --record 1 --output $lostRecovered --max-bytes 1024 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Lost-partition file extraction failed: $($lostExtractOutput -join ' ')" }
          if (-not (Test-Path $lostRecovered)) { throw "Lost-partition extraction did not publish its recovered file." }
          $expectedLostPayload = [Text.Encoding]::UTF8.GetBytes("DiskRescue synthetic recovered content")
          $actualLostPayload = [IO.File]::ReadAllBytes($lostRecovered)
          if ([Convert]::ToHexString($actualLostPayload) -ne [Convert]::ToHexString($expectedLostPayload)) { throw "Lost-partition recovered content mismatch." }
          $lostRecoveryHash = (Get-FileHash -Algorithm SHA256 $lostRecovered).Hash
          Write-Output "Lost-partition end-to-end recovery verified. SHA256: $lostRecoveryHash"
          $sourceImage = "$env:RUNNER_TEMP/DiskRescue-TestImages/gpt-valid.img"
          $copiedImage = "$env:RUNNER_TEMP/DiskRescue-TestImages/gpt-valid-copy.img"
          dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- image-copy $sourceImage $copiedImage
          if (-not (Test-Path $copiedImage)) { throw "Image-copy command did not create its destination." }
          $sourceHash = (Get-FileHash -Algorithm SHA256 $sourceImage).Hash
          $copyHash = (Get-FileHash -Algorithm SHA256 $copiedImage).Hash
          if ($sourceHash -ne $copyHash) { throw "Image-copy SHA-256 does not match its source." }
          $existingCopy = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- image-copy $sourceImage $copiedImage 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Image-copy unexpectedly overwrote an existing destination." }
          $global:LASTEXITCODE = 0
          $ntfs = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- scan-ntfs "$env:RUNNER_TEMP/DiskRescue-TestImages/ntfs-mft-preview.img" --offset 512 --length 65024 --max-records 4 | ConvertFrom-Json
          if ($ntfs.scan.entries.Count -ne 1 -or $ntfs.scan.entries[0].name -ne "Report.txt") { throw "Synthetic NTFS MFT fixture did not return the expected Report.txt entry." }
          if ($ntfs.scan.recordsExamined -ne 4 -or -not $ntfs.safety.sourceOpenedReadOnly -or $ntfs.safety.fileRecoveryAvailable) { throw "NTFS scan safety or record-count assertions failed." }
          $recoveredFile = "$env:RUNNER_TEMP/DiskRescue-TestImages/Report-recovered.txt"
          $extractOutput = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- extract-ntfs-file "$env:RUNNER_TEMP/DiskRescue-TestImages/ntfs-mft-preview.img" --offset 512 --length 65024 --record 1 --output $recoveredFile --max-bytes 1024 2>&1
          if ($LASTEXITCODE -ne 0) { throw "NTFS extraction command failed: $($extractOutput -join ' ')" }
          if (-not (Test-Path $recoveredFile)) { throw "NTFS extraction did not publish its recovered file." }
          $expectedPayload = [Text.Encoding]::UTF8.GetBytes("DiskRescue synthetic recovered content")
          $actualPayload = [IO.File]::ReadAllBytes($recoveredFile)
          if ([Convert]::ToHexString($actualPayload) -ne [Convert]::ToHexString($expectedPayload)) { throw "NTFS extraction content mismatch. Actual SHA-256: $((Get-FileHash -Algorithm SHA256 $recoveredFile).Hash)" }
          $existingRecovery = dotnet run --project src/DiskRescue.Cli --configuration Release --no-build -- extract-ntfs-file "$env:RUNNER_TEMP/DiskRescue-TestImages/ntfs-mft-preview.img" --offset 512 --length 65024 --record 1 --output $recoveredFile --max-bytes 1024 2>&1
          $recoveryExitCode = $LASTEXITCODE
          if ($recoveryExitCode -eq 0) { throw "NTFS extraction unexpectedly overwrote an existing output file." }
          $global:LASTEXITCODE = 0
      - name: Smoke-test deleted NTFS extraction and recovery manifest
        shell: pwsh
        run: ./tools/Test-DeletedNtfsRecovery.ps1 -OutputDirectory "$env:RUNNER_TEMP/DiskRescue-DeletedRecovery-Source" -DestinationDirectory "$env:TEMP/DiskRescue-DeletedRecovery-Destination"
      - name: Smoke-test one-command lost NTFS recovery harness
        shell: pwsh
        run: ./tools/Test-LostNtfsRecovery.ps1 -OutputDirectory "$env:RUNNER_TEMP/DiskRescue-Recovery-Harness"
      - name: Build WPF desktop application
        run: dotnet build src/DiskRescue.Desktop/DiskRescue.Desktop.csproj --configuration Release --no-restore
      - name: Publish Windows x64 desktop preview
        run: dotnet publish src/DiskRescue.Desktop/DiskRescue.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/DiskRescue-Pro-Desktop-win-x64
      - name: Upload Windows x64 desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: DiskRescue-Pro-Desktop-win-x64-preview
          path: artifacts/DiskRescue-Pro-Desktop-win-x64/**
          if-no-files-found: error
      - name: Publish Windows x64 CLI preview
        run: dotnet publish src/DiskRescue.Cli/DiskRescue.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/DiskRescue-Pro-win-x64
      - name: Upload Windows x64 CLI preview
        uses: actions/upload-artifact@v4
        with:
          name: DiskRescue-Pro-win-x64-preview
          path: artifacts/DiskRescue-Pro-win-x64/**
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diskrescue-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
